services:
  whisperflow:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WHISPERFLOW_PORT:-8181}:8181"
    environment:
      - WHISPERFLOW_API_KEY=${WHISPERFLOW_API_KEY:-}
      - WHISPERFLOW_CONFIG=/app/config/whisperflow.json
    volumes:
      - whisperflow-config:/app/config
      - whisperflow-models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - whisperflow-net

